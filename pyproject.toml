[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-portfolio"
version = "0.1.0"
description = "An educational credit default risk evaluation project"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "xlrd>=2.0.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
